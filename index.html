<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>OnStage - O espetáculo ao seu alcance</title>
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <div class="menu-button">&#9776;</div>
        <div class="logo-container">
            <img src="img/OS_Logotipo_Black.png" alt="Logo" class="logo">
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Buscar eventos...">
        </div>
        <button class="auth-btn">Cadastrar/Login</button>
        <button id="theme-black" class="theme-button">Tema Black</button>
        <button id="theme-white" class="theme-button">Tema White</button>
    </header>
   
    <!-- Corpo principal -->
    <main>
        <section class="EventosEmAlta">
            <h2>Eventos em Alta</h2>
            <div class="content-row">
                <div class="FilmesEmAlta"></div>
                <div class="PeçasEmAlta"></div>
            </div>
        </section>
        
        <section class="EventosProximos">
            <h2>Eventos Próximos</h2>
            <div class="content-grid">
                <div class="category-box"></div>
                <div class="category-box"></div>
                <div class="category-box"></div>
                <div class="category-box"></div>
            </div>
        </section>

        <section class="Estreando">
            <h2>Estreando</h2>
            <div class="content-row">
                <div class="content-box"></div>
                <div class="content-box"></div>
            </div>
        </section>

        <section class="EmBreve">
            <h2>Em Breve</h2>
            
        </section>

       
        <section>
          <section class="main-content">
            <div class="section-title">Cinema</div>
            <div class="content-row">
              <div class="content-box"></div>
              <div class="content-box"></div>
              <div class="content-box"></div>
              <div class="content-box"></div>
            </div>
            <div class="section-title">Teatro</div>
            <div class="content-row">
              <div class="content-box"></div>
              <div class="content-box"></div>
              <div class="content-box"></div>
              <div class="content-box"></div>
            </div>
            <div class="section-title">Shows</div>
            <div class="content-row">
              <div class="content-box"></div>
              <div class="content-box"></div>
              <div class="content-box"></div>
              <div class="content-box"></div>
            </div>
            <div class="section-title">Eventos</div>
            <div class="content-row">
              <div class="content-box"></div>
              <div class="content-box"></div>
              <div class="content-box"></div>
              <div class="content-box"></div>
            </div>
          </section>
    </main>
    
    <!-- Rodapé -->
    <footer class="footer">
        <p>&copy; 2024 OnStage. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
